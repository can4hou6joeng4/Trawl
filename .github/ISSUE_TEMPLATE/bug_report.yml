name: Bug 报告
description: 提交一个 Bug 报告以帮助改进项目
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽可能详细地描述问题。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 使用的 Legal Extractor 版本
      placeholder: "例如: v3.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows
        - Docker / Web
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现该问题
      value: |
        1. 打开应用
        2. 选择文件 '...'
        3. 点击 '...'
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 如有相关日志输出或截图，请粘贴在此
