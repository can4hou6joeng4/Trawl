name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请描述你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你遇到了什么问题或不便？
      placeholder: "当我处理 XX 类型的文书时，无法 ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望的解决方案是什么
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他相关上下文或截图
