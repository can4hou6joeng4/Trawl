name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

          # 清除 Go 构建缓存，确保每次完整重新编译
          go clean -cache

          # 注入构建时间戳并构建原生应用
          BUILD_TIME=$(date +%s)
          wails build -platform darwin/universal -s -ldflags "-X 'legal-extractor/internal/config.BuildTime=$BUILD_TIME'"

      - name: Create DMG (Manual Method)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="dev"
          fi

          APP_NAME="legal-extractor.app"
          APP_PATH="build/bin/$APP_NAME"
          DMG_NAME="legal-extractor_${VERSION}_darwin_universal.dmg"

          if [ -d "$APP_PATH" ]; then
            echo "📦 Packaging $APP_PATH into $DMG_NAME..."

            # 1. 创建临时镜像
            hdiutil create -size 200m -volname "LegalExtractor" -type SPARSE -fs HFS+ -fsargs "-c c=64,a=16,e=16" tmp_image

            # 2. 挂载
            MOUNT_POINT=$(hdiutil attach -nobrowse -noverify -noautoopen tmp_image.sparseimage | grep "Apple_HFS" | awk '{print $3}')
            echo "💿 Mounted at: $MOUNT_POINT"

            # 3. 复制 App
            cp -R "$APP_PATH" "$MOUNT_POINT/"
            ln -s /Applications "$MOUNT_POINT/Applications"

            # 4. 卸载并转换
            hdiutil detach "$MOUNT_POINT"
            hdiutil convert tmp_image.sparseimage -format UDZO -o "build/bin/$DMG_NAME"
            rm tmp_image.sparseimage

            echo "✅ DMG Packaging complete"
          else
            echo "❌ App bundle not found at $APP_PATH"
            exit 1
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            build/bin/*.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build Windows OCR Bridge
        shell: powershell
        run: |
          dotnet publish internal/extractor/bridge_bin/win_ocr/WinOcrBridge.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o build/bin/bridge_bin

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: powershell
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

          # 清除 Go 构建缓存，确保每次完整重新编译
          go clean -cache

          # 注入构建时间戳并构建原生应用
          $BUILD_TIME = [int][double]::Parse((Get-Date -UFormat %s))
          wails build -platform windows/amd64 -s -ldflags "-X 'legal-extractor/internal/config.BuildTime=$BUILD_TIME'"
          wails build -platform windows/amd64 -nsis -s -ldflags "-X 'legal-extractor/internal/config.BuildTime=$BUILD_TIME'"

      - name: Package Windows
        shell: powershell
        run: |
          $VERSION = "${{ github.ref_name }}" -replace "v",""
          if ([string]::IsNullOrEmpty($VERSION)) { $VERSION = "dev" }

          # 创建分发目录
          $DistDir = "build/bin/legal-extractor-windows-amd64"
          New-Item -ItemType Directory -Path $DistDir -Force | Out-Null

          # 复制主程序
          Copy-Item "build/bin/legal-extractor.exe" -Destination "$DistDir/legal-extractor.exe"

          # 复制识别引擎目录 (确保 bridge_bin 存在)
          if (Test-Path "build/bin/bridge_bin") {
              Copy-Item -Path "build/bin/bridge_bin" -Destination "$DistDir/" -Recurse
          }

          # 打包为 ZIP
          Compress-Archive -Path "$DistDir/*" -DestinationPath "build/bin/legal-extractor_${VERSION}_windows_amd64.zip"

          # 标准化安装器命名，避免直接暴露 Wails 默认架构命名差异
          $Installer = Get-ChildItem -Path "build/bin" -Filter "*installer.exe" | Select-Object -First 1
          if ($Installer) {
              Copy-Item $Installer.FullName -Destination "build/bin/legal-extractor_${VERSION}_windows_amd64_setup.exe"
          } else {
              throw "Windows installer was not generated"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/bin/*.zip
            build/bin/*_setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Assets
        run: |
          mkdir -p final-assets

          # 收集所有产物到根目录 (包含 DMG、ZIP 和安装器)
          find release-assets -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} final-assets/ \;

          # 收集对应的 Release Notes MD 文件作为资产
          VERSION_FILE="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$VERSION_FILE" ]; then
            cp "$VERSION_FILE" final-assets/
          fi

          echo "📋 Final assets to upload:"
          ls -lah final-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: final-assets/*
          # 使用精心编写的 MD 文件作为 Release 的正文内容
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
