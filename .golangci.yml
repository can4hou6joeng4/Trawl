version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - frontend
      - build

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      check-blank: false
  exclusions:
    paths:
      - frontend
      - build
      - "^main\\.go$"
    rules:
      - path: _test\.go
        linters:
          - errcheck
